<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>2026 → 2032</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1A17; --panel:#252019; --panel-2:#2C261E;
    --text:#EDE6DA; --muted:#A79C8C;
    --gold:#C68A3A; --green:#5C7059;
    --line:rgba(237,230,218,0.14);
    --red:#C1554B; --yellow:#D9A441; --ok:#6E9469;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Work Sans',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  a{color:var(--gold);}

  .topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .topbar h1{font-size:19px;}
  .today{font-size:11.5px;color:var(--muted);}
  .sync-status{font-size:11px;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
  .dot.on{background:var(--ok);}
  .dot.off{background:var(--red);}
  .sync-status button{background:none;border:none;color:var(--gold);font-size:11px;cursor:pointer;padding:0;text-decoration:underline;}

  section{margin-bottom:26px;}
  .section-title{font-size:15px;margin-bottom:10px;color:var(--muted);font-weight:500;}
  .timeline-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 14px 14px;}
  .tl-track{position:relative;height:6px;background:var(--panel-2);border-radius:3px;margin:22px 6px 8px;}
  .tl-node{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--muted);transform:translate(-50%,-50%);border:2px solid var(--bg);}
  .tl-node.done{background:var(--ok);}
  .tl-marker{position:absolute;top:-16px;transform:translateX(-50%);font-size:14px;line-height:1;}
  .tl-marker.expected{top:14px;color:var(--muted);}
  .tl-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px;}
  .tl-status{font-size:12.5px;margin-top:10px;color:var(--text);}
  .tl-status .pace{font-weight:600;}
  .pace.ahead{color:var(--ok);}
  .pace.behind{color:var(--red);}
  .pace.ontrack{color:var(--gold);}

  .phases{position:relative;padding-left:22px;}
  .phases::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line);}
  details{position:relative;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;}
  details[open]{border-color:var(--gold);}
  details::before{content:attr(data-n);position:absolute;left:-22px;top:14px;width:17px;height:17px;border-radius:50%;background:var(--bg);border:1px solid var(--gold);color:var(--gold);font-family:'Fraunces',serif;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  details[data-done="1"]::before{background:var(--ok);border-color:var(--ok);color:var(--bg);}
  summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  summary::-webkit-details-marker{display:none;}
  summary .stitle{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;}
  summary .sfrac{color:var(--muted);font-size:11.5px;white-space:nowrap;}
  .panel-body{padding:0 14px 16px;border-top:1px solid var(--line);}
  .block{margin-top:12px;}
  .block .label{font-size:11px;letter-spacing:0.02em;color:var(--gold);font-weight:600;margin-bottom:4px;}
  .block p{font-size:13.5px;margin:0;}

  .task-card{background:var(--panel-2);border-radius:10px;padding:14px;margin-top:14px;}
  .task-card .thead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .task-card .ttitle{font-size:14.5px;font-weight:600;}
  .urg{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;color:var(--bg);}
  .urg.red{background:var(--red);} .urg.yellow{background:var(--yellow);} .urg.green{background:var(--ok);}
  .due{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
  .pbar-outer{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-bottom:4px;}
  .pbar-inner{height:100%;background:var(--gold);border-radius:5px;transition:width .25s ease;}
  .pct-label{font-size:11px;color:var(--muted);text-align:right;margin-bottom:12px;}

  .btn-row{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;}
  .btn-row button{padding:4px 8px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;}
  .btn-row button:active{background:var(--gold);color:var(--bg);border-color:var(--gold);}
  .btn-row button.neg{color:var(--muted);}

  .tasklist{margin-top:14px;}
  .tlrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .tlrow:last-child{border-bottom:none;}
  .tlhead{display:flex;align-items:center;gap:8px;}
  .tlrow .chk{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--bg);}
  .tlrow .chk.done{background:var(--ok);border-color:var(--ok);}
  .tlrow .chk.current{border-color:var(--gold);}
  .tlrow .ttl{flex:1;color:var(--text);font-weight:500;}
  .tlrow.done .ttl{color:var(--muted);text-decoration:line-through;}
  .tlrow .tp{color:var(--muted);font-size:11px;}
  .tlactions{display:flex;justify-content:space-between;align-items:center;padding-left:23px;}
  .mini-pbar{flex:1;max-width:120px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;}
  .mini-pfill{height:100%;background:var(--gold);border-radius:3px;}

  .complete-banner{background:var(--panel-2);border:1px solid var(--ok);border-radius:10px;padding:16px;text-align:center;font-size:14px;}

  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap;margin-top:14px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:9px;height:9px;border-radius:50%;display:inline-block;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>2026 → 2032</h1>
    <div class="today" id="todayLabel"></div>
  </div>
  <div class="sync-status" id="syncStatus">
    <span class="dot" id="syncDot"></span>
    <span id="syncText">checking sync…</span> 
    <button id="syncNowBtn" style="display:none;">retry sync</button>
  </div>

  <section>
    <div class="section-title">Timeline</div>
    <div class="timeline-wrap">
      <div class="tl-track" id="tlTrack"></div>
      <div class="tl-labels"><span>Sep 2026</span><span>2032</span></div>
      <div class="tl-status" id="tlStatus"></div>
      <div class="legend">
        <span><span class="sw" style="background:var(--gold);"></span>you</span>
        <span><span class="sw" style="background:var(--muted);"></span>expected pace</span>
      </div>
    </div>
  </section>

  <section id="phasesSection">
    <div class="section-title">Phases</div>
    <div class="phases" id="phasesList"></div>
  </section>

  <div class="legend" style="padding:0 4px;">
    <span><span class="sw" style="background:var(--red);"></span>due ≤3 days</span>
    <span><span class="sw" style="background:var(--yellow);"></span>due ≤14 days</span>
    <span><span class="sw" style="background:var(--ok);"></span>plenty of time</span>
  </div>

</div>

<script>
const BIN_ID = "6a9a937ada38895dfe37c125";
const API_KEY = "$2a$10$hlqfMzR5Oh/4/9sT94qsn.9nKQ.nyIYDwhpAXEDkOuFVmjKz.JDtm";

function defaultState(){
  return {
    roadmapVersion: ROADMAP_VERSION,
    currentPhaseIndex: 0,
    phases: [
      {
        title:"Christmas 2026 — Prove the engines", dateLabel:"Sep 2026–Jan 2027",
        who:"Run two different bets without confusing them: nakreslime.cz is the scalable AI experiment; Forever in Paint is the scarce, premium handmade offer.",

        tasks:[
          {title:"Define Forever in Paint Christmas offer + 10k Kč target", due:"2026-10-04", pct:0},
          {title:"Finish first Forever portfolio / pet examples", due:"2026-10-11", pct:0},
          {title:"Make both customer journeys work end-to-end", due:"2026-10-11", pct:0},
          {title:"Launch Forever Christmas — first 3/10", due:"2026-10-18", pct:0},
          {title:"Get first real Nakreslime.cz funnel data", due:"2026-10-25", pct:0},
          {title:"Turn early demand into repeatable production", due:"2026-11-08", pct:0},
          {title:"Lock Christmas capacity + production schedule", due:"2026-11-22", pct:0},
          {title:"Push Forever toward 10/10 — only if capacity supports it", due:"2026-12-13", pct:0},
          {title:"Deliver every Forever Christmas commission", due:"2026-12-20", pct:0},

        ]
      },
      {

        tasks:[

          {title:"Define the next Forever in Paint offer", due:"2027-02-01", pct:0},
          {title:"Build a stronger original painting portfolio", due:"2027-05-01", pct:0},
          {title:"Develop a clearer personal visual direction", due:"2027-08-01", pct:0},

        ]
      },
      {

        routine:"Painting first. Teaching is built from things already learned and practiced.",
        tasks:[
          {title:"Define teaching format + first paid product", due:"2028-03-01", pct:0},
          {title:"Publish first serious teaching content", due:"2028-06-01", pct:0},
          {title:"Launch 1:1 mentorship test", due:"2028-09-01", pct:0},

        ]
      },
      {

        who:"Build the financial base for the long-term life: independence, space and a place where the work can grow.",
        routine:"One concrete property / financing action every week when this phase becomes active.",
        tasks:[
          {title:"Set property budget + financing target", due:"2029-02-01", pct:0},
          {title:"Research land / house options consistently", due:"2029-06-01", pct:0},
          {title:"Move financing or purchase process into reality", due:"2029-12-31", pct:0}
        ]
      },
      {
        title:"Make teaching primary", dateLabel:"2030",
        who:"Move from artist with multiple income streams toward a deliberate artist-educator business.",
        routine:"Review income and time allocation monthly. Let the numbers determine when employment can be reduced.",
        tasks:[
          {title:"Teaching + mentorship become a major income stream", due:"2030-06-01", pct:0},
          {title:"Build a reliable content → customer system", due:"2030-09-01", pct:0},

        ]
      },
      {
        title:"Family + consolidation", dateLabel:"2031",
        who:"Use the freedom created by the previous phases to protect family, relationships and the quality of life the work is supposed to fund.",
        routine:"Schedule family deliberately instead of assuming time will appear by itself.",
        tasks:[
          {title:"Build concrete support for mom's retirement", due:"2031-03-01", pct:0},
          {title:"Make a concrete move toward dad", due:"2031-06-01", pct:0},
          {title:"Set a sustainable cadence with brother", due:"2031-09-01", pct:0},
          {title:"Simplify the business around the highest-value work", due:"2031-12-31", pct:0}
        ]
      },
      {
        title:"2032 — Live the vision", dateLabel:"2032",
        who:"The roadmap stops being a list of goals and becomes the normal life: serious painting, teaching, family, financial independence and a home with space to work.",
        routine:"Protect the life that was built. Keep choosing the work and relationships that matter.",
        tasks:[
          {title:"AVU graduation", due:"2032-06-30", pct:0},
          {title:"Forest home / property reality", due:"2032-12-31", pct:0},
          {title:"Teaching-first business fully running", due:"2032-12-31", pct:0},
          {title:"Family relationships in a healthy ongoing rhythm", due:"2032-12-31", pct:0},
          {title:"Physical target reached and maintained", due:"2032-12-31", pct:0}
        ]
      }
    ]
  };
}

const ROADMAP_VERSION = 3;
let state = defaultState();
let saveTimer = null;

function daysUntil(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const now = new Date();
  const n = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((d - n) / 86400000);
}

function urgencyClass(days){
  if(days <= 3) return "red";
  if(days <= 14) return "yellow";
  return "green";
}

function findCurrentTask(phase){
  return phase.tasks.find(t => t.pct < 100);
}

function phaseDone(phase){
  return phase.tasks.every(t => t.pct >= 100);
}

function syncActivePhase(){
  let firstUnfinished = 0;
  while(firstUnfinished < state.phases.length - 1 && phaseDone(state.phases[firstUnfinished])){
    firstUnfinished++;
  }
  state.currentPhaseIndex = firstUnfinished;
}

function render(){
  document.getElementById("todayLabel").textContent =
    new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});

  syncActivePhase();
  renderTimeline();
  renderPhases();
}

function phaseStartDates(){
  return ["2026-09-29","2027-01-01","2028-01-01","2029-01-01","2030-01-01","2031-01-01","2032-01-01"];
}
const GOAL_END = "2032-12-31";

function expectedPosition(){
  const starts = phaseStartDates().map(d=>new Date(d+"T00:00:00").getTime());
  const end = new Date(GOAL_END+"T00:00:00").getTime();
  const now = Date.now();
  if(now <= starts[0]) return 0;
  if(now >= end) return 6;
  for(let i=0;i<6;i++){
    if(now >= starts[i] && now < starts[i+1]){
      const frac = (now - starts[i]) / (starts[i+1]-starts[i]);
      return i + frac;
    }
  }
  const frac = (now - starts[6]) / (end - starts[6]);
  return 6 + Math.min(frac,1)*0;
}

function actualPosition(){
  const idx = state.currentPhaseIndex;
  const ph = state.phases[idx];
  if(!ph) return 0;
  const done = ph.tasks.filter(t=>t.pct>=100).length;
  const total = ph.tasks.length;
  return idx + (total? done/total : 0);
}

function renderTimeline(){
  const track = document.getElementById("tlTrack");
  track.innerHTML = "";
  for(let i=0;i<7;i++){
    const node = document.createElement("div");
    node.className = "tl-node" + (i < state.currentPhaseIndex || (i===state.currentPhaseIndex && phaseDone(state.phases[i])) ? " done":"");
    node.style.left = (i/6*100)+"%";
    track.appendChild(node);
  }
  const exp = document.createElement("div");
  exp.className = "tl-marker expected";
  exp.style.left = (expectedPosition()/6*100)+"%";
  exp.textContent = "▲";
  track.appendChild(exp);

  const act = document.createElement("div");
  act.className = "tl-marker";
  act.style.left = (actualPosition()/6*100)+"%";
  act.style.color = "var(--gold)";
  act.textContent = "●";
  track.appendChild(act);

  const diff = actualPosition() - expectedPosition();
  let word, cls;
  if(diff > 0.15){ word = "ahead of pace"; cls="ahead"; }
  else if(diff < -0.15){ word = "behind pace"; cls="behind"; }
  else { word = "on pace"; cls="ontrack"; }
  
  const currentTitle = state.phases[state.currentPhaseIndex] ? state.phases[state.currentPhaseIndex].title : "";
  document.getElementById("tlStatus").innerHTML =
    `You're in <strong>${currentTitle}</strong> — <span class="pace ${cls}">${word}</span>.`;
}

function renderPhases(){
  const list = document.getElementById("phasesList");
  list.innerHTML = "";

  if(state.currentPhaseIndex >= state.phases.length - 1 && phaseDone(state.phases[state.phases.length-1])){
    const b = document.createElement("div");
    b.className = "complete-banner";
    b.textContent = "Every phase complete. You're living the 2032 vision.";
    list.appendChild(b);
  }

  state.phases.forEach((phase, i) => {
    const done = phaseDone(phase);
    const doneCount = phase.tasks.filter(t=>t.pct>=100).length;
    const det = document.createElement("details");
    det.dataset.n = i;
    det.dataset.done = done ? "1":"0";
    if(i === state.currentPhaseIndex) det.open = true;

    const sum = document.createElement("summary");
    sum.innerHTML = `<span class="stitle">${phase.title}</span><span class="sfrac">${doneCount}/${phase.tasks.length} · ${phase.dateLabel}</span>`;
    det.appendChild(sum);

    const body = document.createElement("div");
    body.className = "panel-body";

    body.innerHTML += `
      <div class="block"><div class="label">Who</div><p>${phase.who}</p></div>
      ${phase.routine ? `<div class="block"><div class="label">Daily routine</div><p>${phase.routine}</p></div>` : ''}
    `;

    const tl = document.createElement("div");
    tl.className = "tasklist";
    const curTask = findCurrentTask(phase);

    phase.tasks.forEach(t => {
      const row = document.createElement("div");
      const isDone = t.pct >= 100;
      const isCurrent = curTask && t === curTask;
      row.className = "tlrow" + (isDone ? " done" : "");
      
      row.innerHTML = `
        <div class="tlhead">
          <span class="chk ${isDone ? 'done' : ''} ${isCurrent ? 'current' : ''}">${isDone ? '✓' : ''}</span>
          <span class="ttl">${t.title}</span>
          <span class="tp">${t.pct}%</span>
        </div>
        <div class="tlactions">
          <div class="mini-pbar"><div class="mini-pfill" style="width:${t.pct}%;"></div></div>
          <div class="btn-row">
            <button class="neg" data-d="-10">−10%</button>
            <button data-d="10">+10%</button>
            <button data-d="25">+25%</button>
          </div>
        </div>
      `;

      row.querySelectorAll("button[data-d]").forEach(btn => {
        btn.addEventListener("click", () => adjustTask(phase, t, parseInt(btn.dataset.d, 10)));
      });

      tl.appendChild(row);
    });

    body.appendChild(tl);
    det.appendChild(body);
    list.appendChild(det);
  });
}

function adjustTask(phase, task, delta){
  task.pct = Math.max(0, Math.min(100, task.pct + delta));
  render();
  saveState();
}

/* ---------- Persistence via JSONbin.io ---------- */
async function loadState(){
  const cached = localStorage.getItem("roadmap_state_cache");
  if(cached){
    try {
      const parsed = JSON.parse(cached);
      if(parsed && parsed.phases && parsed.roadmapVersion === ROADMAP_VERSION) state = parsed;
    } catch(e){}
  }
  render();

  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { "X-Master-Key": API_KEY }
    });
    if(res.ok){
      const data = await res.json();
      if(data.record && data.record.phases && data.record.roadmapVersion === ROADMAP_VERSION){
        state = data.record;
        localStorage.setItem("roadmap_state_cache", JSON.stringify(state));
        render();
        setSyncStatus(true);
        return;
      }
      state = defaultState();
      localStorage.setItem("roadmap_state_cache", JSON.stringify(state));
      render();
      await pushToCloud();
    } else {
      setSyncStatus(false, "access denied");
    }
  } catch(e) {
    setSyncStatus(false, "network error");
  }
}

function saveState(){
  localStorage.setItem("roadmap_state_cache", JSON.stringify(state));
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(pushToCloud, 400);
}

async function pushToCloud(){
  document.getElementById("syncText").textContent = "saving…";
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      },
      body: JSON.stringify(state)
    });
    setSyncStatus(res.ok);
  } catch(e) {
    setSyncStatus(false, "save failed");
  }
}

function setSyncStatus(ok, msg){
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncText");
  const btn = document.getElementById("syncNowBtn");
  if(ok){
    dot.className = "dot on";
    txt.textContent = "cloud sync active";
    btn.style.display = "none";
  } else {
    dot.className = "dot off";
    txt.textContent = msg ? `sync error (${msg})` : "offline";
    btn.style.display = "inline";
  }
}

document.getElementById("syncNowBtn").addEventListener("click", pushToCloud);

loadState();
</script>
</body>
</html>
